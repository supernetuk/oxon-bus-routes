name: Build bus routes

on:
 schedule:
   - cron: "20 4 1 * *"   # 04:20 UTC on the 1st of every month
 workflow_dispatch:        # adds a "Run workflow" button

permissions:
 contents: write

jobs:
 build:
   runs-on: ubuntu-latest
   timeout-minutes: 60
   steps:
     - uses: actions/checkout@v4

     - uses: actions/setup-python@v5
       with:
         python-version: "3.12"

     - name: Build routes.json from BODS timetables
       env:
         BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
       run: python build_routes.py --out routes.json --keep-zip /tmp/south_east_gtfs.zip

     - name: Save routes.json to the repository
       run: |
         git config user.name "github-actions[bot]"
         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         git add routes.json
         git diff --cached --quiet || git commit -m "Update routes.json"
         git push
